<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>メッセージ管理 - XXXフルオーダーに関して</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
			background: #f0f2f5;
			color: #1c1e21;
		}
		header {
			padding: 12px 20px;
			background: #fff;
			border-bottom: 1px solid #ddd;
			display: flex;
			align-items: center;
			justify-content: space-between;
		}
		header h1 { font-size: 18px; margin: 0; }
		header button {
			border: 1px solid #ccc;
			background: #fff;
			border-radius: 6px;
			padding: 6px 12px;
			cursor: pointer;
			font-size: 13px;
		}
		.stage {
			display: flex;
			gap: 16px;
			padding: 16px;
			height: calc(100vh - 53px);
		}
		.pane {
			flex: 1;
			display: flex;
			flex-direction: column;
			background: #fff;
			border-radius: 10px;
			overflow: hidden;
			box-shadow: 0 1px 3px rgba(0,0,0,.1);
		}
		.pane-head {
			padding: 12px 16px;
			font-weight: 600;
			color: #fff;
		}
		.pane.user .pane-head { background: #1877f2; }
		.pane.pro .pane-head { background: #00a152; }
		.messages {
			flex: 1;
			overflow-y: auto;
			padding: 16px;
			display: flex;
			flex-direction: column;
			gap: 10px;
			background: #f7f8fa;
		}
		.msg { max-width: 80%; }
		.msg .bubble {
			padding: 8px 12px;
			border-radius: 14px;
			background: #e4e6eb;
			display: inline-block;
			word-break: break-word;
			white-space: pre-wrap;
			text-align: left;
		}
		.msg img {
			max-width: 200px;
			border-radius: 10px;
			display: block;
			margin-top: 4px;
		}
		.msg .file-link {
			display: flex;
			align-items: center;
			gap: 8px;
			margin-top: 4px;
			padding: 8px 10px;
			background: rgba(0,0,0,.08);
			border-radius: 8px;
			text-decoration: none;
			color: inherit;
		}
		.msg .file-link .icon { font-size: 22px; }
		.msg .file-link .fname { font-size: 13px; word-break: break-all; }
		.msg .meta { font-size: 11px; color: #888; margin-top: 3px; }
		/* 自分の発言は右寄せ */
		.msg.mine { align-self: flex-end; text-align: right; }
		.pane.user .msg.user .bubble,
		.pane.pro .msg.pro .bubble { background: #1877f2; color: #fff; }
		.pane.pro .msg.pro .bubble { background: #00a152; }
		.composer {
			border-top: 1px solid #eee;
			padding: 10px;
			display: flex;
			gap: 8px;
			align-items: center;
		}
		.composer textarea {
			flex: 1;
			border: 1px solid #ccc;
			border-radius: 14px;
			padding: 8px 14px;
			font-size: 14px;
			font-family: inherit;
			line-height: 1.4;
			resize: vertical;
			max-height: 140px;
		}
		.composer button, .composer label {
			border: none;
			background: #1877f2;
			color: #fff;
			border-radius: 18px;
			padding: 8px 14px;
			cursor: pointer;
			font-size: 14px;
			white-space: nowrap;
		}
		.composer label { background: #e4e6eb; color: #333; }
		.composer .preview {
			max-height: 32px;
			border-radius: 4px;
		}
	</style>
</head>
<body>
	<header>
		<h1>メッセージ管理 - XXXフルオーダーに関して</h1>
		<button id="reset">会話をリセット</button>
	</header>
	<div class="stage">
		<section class="pane user" data-role="user">
			<div class="pane-head">👤 ユーザー（依頼者）</div>
			<div class="messages"></div>
			<form class="composer">
				<label>📎<input type="file" accept="image/*,application/pdf" hidden /></label>
				<span class="preview" hidden></span>
				<textarea placeholder="メッセージを入力...（改行可 / Ctrl+Enterで送信）" rows="1"></textarea>
				<button type="submit">送信</button>
			</form>
		</section>
		<section class="pane pro" data-role="pro">
			<div class="pane-head">🛠️ 業者（プロ）</div>
			<div class="messages"></div>
			<form class="composer">
				<label>📎<input type="file" accept="image/*,application/pdf" hidden /></label>
				<span class="preview" hidden></span>
				<textarea placeholder="メッセージを入力...（改行可 / Ctrl+Enterで送信）" rows="1"></textarea>
				<button type="submit">送信</button>
			</form>
		</section>
	</div>

	<script>
		const ROLE_LABEL = { user: 'ユーザー', pro: '業者' };

		// 添付ファイルを種類に応じて表示（画像はインライン、それ以外はリンク）
		function renderAttachment(file) {
			if (file.type && file.type.startsWith('image/')) {
				const img = document.createElement('img');
				img.src = file.dataUrl;
				img.alt = file.name;
				return img;
			}
			const link = document.createElement('a');
			link.className = 'file-link';
			link.href = file.dataUrl;
			link.target = '_blank';
			link.rel = 'noopener';
			link.download = file.name;
			const icon = document.createElement('span');
			icon.className = 'icon';
			icon.textContent = file.type === 'application/pdf' ? '📄' : '📎';
			const fname = document.createElement('span');
			fname.className = 'fname';
			fname.textContent = file.name;
			link.appendChild(icon);
			link.appendChild(fname);
			return link;
		}

		function render(paneEl, messages) {
			const role = paneEl.dataset.role;
			const box = paneEl.querySelector('.messages');
			const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
			box.innerHTML = '';
			for (const m of messages) {
				const wrap = document.createElement('div');
				wrap.className = 'msg ' + m.sender + (m.sender === role ? ' mine' : '');
				const bubble = document.createElement('div');
				bubble.className = 'bubble';
				if (m.text) {
					const span = document.createElement('span');
					span.textContent = m.text;
					bubble.appendChild(span);
				}
				if (m.file) bubble.appendChild(renderAttachment(m.file));
				const meta = document.createElement('div');
				meta.className = 'meta';
				const t = new Date(m.ts);
				meta.textContent = ROLE_LABEL[m.sender] + ' · ' +
					t.getHours().toString().padStart(2, '0') + ':' +
					t.getMinutes().toString().padStart(2, '0');
				wrap.appendChild(bubble);
				wrap.appendChild(meta);
				box.appendChild(wrap);
			}
			if (atBottom) box.scrollTop = box.scrollHeight;
		}

		async function poll() {
			try {
				const res = await fetch('/api/messages');
				const messages = await res.json();
				document.querySelectorAll('.pane').forEach(p => render(p, messages));
			} catch (e) { /* ネットワーク一時エラーは無視 */ }
		}

		function setupComposer(paneEl) {
			const role = paneEl.dataset.role;
			const form = paneEl.querySelector('.composer');
			const textInput = form.querySelector('textarea');
			const fileInput = form.querySelector('input[type="file"]');
			const preview = form.querySelector('.preview');
			let pendingFile = null;

			fileInput.addEventListener('change', () => {
				const file = fileInput.files[0];
				if (!file) return;
				const reader = new FileReader();
				reader.onload = () => {
					pendingFile = { name: file.name, type: file.type, dataUrl: reader.result };
					if (file.type.startsWith('image/')) {
						preview.innerHTML = '<img src="' + reader.result + '" style="max-height:32px;border-radius:4px;">';
					} else {
						preview.textContent = (file.type === 'application/pdf' ? '📄 ' : '📎 ') + file.name;
					}
					preview.hidden = false;
				};
				reader.readAsDataURL(file);
			});

			// Ctrl+Enter（Mac は Cmd+Enter）で送信
			textInput.addEventListener('keydown', (e) => {
				if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
					e.preventDefault();
					form.requestSubmit();
				}
			});

			form.addEventListener('submit', async (e) => {
				e.preventDefault();
				const text = textInput.value.trim();
				if (!text && !pendingFile) return;
				await fetch('/api/messages', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ sender: role, text, file: pendingFile })
				});
				textInput.value = '';
				pendingFile = null;
				preview.hidden = true;
				preview.innerHTML = '';
				fileInput.value = '';
				poll();
			});
		}

		document.getElementById('reset').addEventListener('click', async () => {
			await fetch('/api/messages', { method: 'DELETE' });
			poll();
		});

		document.querySelectorAll('.pane').forEach(setupComposer);
		poll();
		setInterval(poll, 2000);
	</script>
</body>
</html>
